name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: ruff (lint)
        run: ruff check backend tests
      - name: ruff (format)
        run: ruff format --check backend tests
      - name: mypy
        run: mypy backend

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: causalguard
          POSTGRES_PASSWORD: causalguard_secret
          POSTGRES_DB: causalguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U causalguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAUSALGUARD_TEST_PG_DSN: postgresql://causalguard:causalguard_secret@localhost:5432/causalguard_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - name: pytest
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=75
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: causalguard/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: causalguard/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: causalguard/backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :edge images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for svc in backend frontend; do
            docker tag causalguard/$svc:ci ghcr.io/${{ github.repository_owner }}/causalguard-$svc:edge
            docker tag causalguard/$svc:ci ghcr.io/${{ github.repository_owner }}/causalguard-$svc:${GITHUB_SHA::12}
            docker push ghcr.io/${{ github.repository_owner }}/causalguard-$svc:edge
            docker push ghcr.io/${{ github.repository_owner }}/causalguard-$svc:${GITHUB_SHA::12}
          done
