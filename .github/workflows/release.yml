name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/causalguard-backend:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/causalguard-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/causalguard-frontend:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/causalguard-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images:
            - `ghcr.io/${{ github.repository_owner }}/causalguard-backend:${{ steps.v.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/causalguard-frontend:${{ steps.v.outputs.version }}`
