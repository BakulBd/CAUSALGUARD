[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalguard"
version = "1.1.0"
description = "CausalGuard: Predict. Simulate. Verify. Prevent. Closed-loop pre-incident reliability and causal verification engine for AMD ROCm."
readme = "README.md"
authors = [{ name = "CausalGuard Engineering Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "uvicorn-worker>=0.2.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "networkx>=3.1",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "SQLAlchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
# Live telemetry adapters + real PostgreSQL sandbox.
postgres = ["asyncpg>=0.29.0"]
rocm = ["torch>=2.2.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "asyncpg>=0.29.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "asyncpg>=0.29.0",
]

[project.scripts]
causalguard = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]
markers = [
    "integration: exercises the full ASGI app / external services",
    "postgres: requires a live PostgreSQL instance (CAUSALGUARD_TEST_PG_DSN)",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/cli.py", "*/__init__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "SIM102", # nested ifs are sometimes clearer than a compound condition
    "SIM108", # ternaries are not always clearer
    "RUF012", # mutable class attrs without ClassVar are fine for config maps
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "ASYNC"]
"backend/config.py" = ["RUF009"]
"backend/models/__init__.py" = ["F403"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
warn_redundant_casts = true
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["frontend", "\\.venv", "tests", "build"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "prometheus_client.*", "numpy.*", "scipy.*", "networkx.*"]
ignore_missing_imports = true
follow_imports = "skip"
