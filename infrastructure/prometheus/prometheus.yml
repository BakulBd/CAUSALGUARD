global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: causalguard

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # CausalGuard API application metrics (/metrics on the backend).
  - job_name: causalguard-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['causalguard-backend:8000']

  # postgres_exporter — powers the `prometheus` telemetry source.
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # node_exporter — host CPU / disk / memory for the same source.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
