# Extra PostgreSQL config mounted into the demo primary so the reliability
# scenarios and pg_stat_statements introspection behave predictably.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all

track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# Keep autovacuum observable but not so aggressive it hides the bloat scenario.
autovacuum = on
autovacuum_naptime = 15s
log_autovacuum_min_duration = 0

# Surface lock waits in the log for the log agent.
log_lock_waits = on
deadlock_timeout = 1s
log_min_duration_statement = 500
